name: Windows builds and tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            label: AMD64
          - rid: win-arm64
            runner: windows-11-arm
            label: ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Verify embedded UI matches its vendored source
        shell: pwsh
        run: |
          npm --prefix ui ci
          npm --prefix ui run build
          git diff --exit-code -- src/Annotator/Web
      - name: Ensure Windows WebView2 runtime
        shell: pwsh
        run: |
          $runtime = @("${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application", "$env:ProgramFiles/Microsoft/EdgeWebView/Application", "$env:LOCALAPPDATA/Microsoft/EdgeWebView/Application") | Where-Object { Test-Path $_ }
          if (-not $runtime) {
            Invoke-WebRequest https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile "$env:RUNNER_TEMP/WebView2Setup.exe"
            $setup = Start-Process "$env:RUNNER_TEMP/WebView2Setup.exe" -ArgumentList '/silent','/install' -PassThru -Wait
            if ($setup.ExitCode -ne 0) { throw "WebView2 install failed: $($setup.ExitCode)" }
          }
      - name: Core regression tests
        run: dotnet run --project tests/Annotator.Tests -c Release
      - name: Build single-file portable EXE (runtime bundled)
        shell: pwsh
        run: |
          dotnet publish src/Annotator -c Release -r ${{ matrix.rid }} --self-contained true -o artifacts/publish -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:SatelliteResourceLanguages=en -p:DebugType=None -p:DebugSymbols=false
          $files = @(Get-ChildItem artifacts/publish -Recurse -File)
          $files | Format-Table Name, Length
          if ($files.Count -ne 1 -or $files[0].Name -ne 'WinScreenshotAnnotator.exe') { throw "Expected exactly one published file (WinScreenshotAnnotator.exe), got $($files.Count)" }
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Copy-Item artifacts/publish/WinScreenshotAnnotator.exe artifacts/release/ScreenshotAnnotator-${{ matrix.label }}.exe
      - name: EXE icon resource check
        shell: pwsh
        run: |
          Add-Type -Namespace R -Name K -MemberDefinition @'
          [DllImport("kernel32.dll", SetLastError=true, CharSet=CharSet.Unicode)] public static extern IntPtr LoadLibraryEx(string f, IntPtr h, uint flags);
          [DllImport("kernel32.dll", SetLastError=true)] public static extern IntPtr FindResource(IntPtr m, IntPtr name, IntPtr type);
          [DllImport("kernel32.dll")] public static extern IntPtr LoadResource(IntPtr m, IntPtr r);
          [DllImport("kernel32.dll")] public static extern IntPtr LockResource(IntPtr r);
          [DllImport("kernel32.dll")] public static extern uint SizeofResource(IntPtr m, IntPtr r);
          public delegate bool EnumNames(IntPtr m, IntPtr type, IntPtr name, IntPtr p);
          [DllImport("kernel32.dll")] public static extern bool EnumResourceNames(IntPtr m, IntPtr type, EnumNames cb, IntPtr p);
          '@
          $exe = (Resolve-Path artifacts/release/ScreenshotAnnotator-${{ matrix.label }}.exe).Path
          $m = [R.K]::LoadLibraryEx($exe, [IntPtr]::Zero, 0x22) # LOAD_LIBRARY_AS_DATAFILE | AS_IMAGE_RESOURCE
          if ($m -eq [IntPtr]::Zero) { throw "LoadLibraryEx failed: $([Runtime.InteropServices.Marshal]::GetLastWin32Error())" }
          $script:groups = @()
          [R.K]::EnumResourceNames($m, [IntPtr]14, { param($mod, $type, $name, $p) $script:groups += $name; $true }, [IntPtr]::Zero) | Out-Null # RT_GROUP_ICON
          if ($script:groups.Count -lt 1) { throw 'EXE has no RT_GROUP_ICON resource' }
          $r = [R.K]::FindResource($m, $script:groups[0], [IntPtr]14)
          $ptr = [R.K]::LockResource([R.K]::LoadResource($m, $r))
          $count = [Runtime.InteropServices.Marshal]::ReadInt16($ptr, 4)
          $sizes = 0..($count - 1) | ForEach-Object { $w = [Runtime.InteropServices.Marshal]::ReadByte($ptr, 6 + 14 * $_); if ($w -eq 0) { 256 } else { $w } }
          Write-Output "Icon group entries: $count, sizes: $($sizes -join ', ')"
          foreach ($want in 16, 20, 24, 32, 48, 64, 256) { if ($sizes -notcontains $want) { throw "EXE icon lacks ${want}px" } }
          Write-Output 'EXE icon resource check passed'
      - name: Native Windows integration tests (single-file EXE)
        shell: pwsh
        run: |
          $process = Start-Process artifacts/release/ScreenshotAnnotator-${{ matrix.label }}.exe -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(120000)) { Stop-Process -Id $process.Id -Force; throw 'Self-test timed out' }
          Get-Content artifacts/self-test/results.txt
          if ($process.ExitCode -ne 0) { throw "Windows integration tests failed: $($process.ExitCode)" }
      - name: Autostart check (Settings toggle writes and removes HKCU Run entry)
        shell: pwsh
        run: |
          $r = Get-Content artifacts/self-test/results.txt
          foreach ($want in 'PASS Settings writes the quoted EXE path to HKCU Run', 'PASS Settings removes the HKCU Run entry') {
            if ($r -notcontains $want) { throw "Missing self-test result: $want" }
          }
          $r | Select-String 'autostart Run value'
          $left = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).ScreenshotAnnotator
          if ($left) { throw "Run entry left behind: $left" }
          Write-Output 'Autostart check passed'
      - name: Startup behavior check (no args -> tray only, hotkey registered, single instance)
        shell: pwsh
        run: |
          Add-Type -Namespace W -Name U -MemberDefinition @'
          [DllImport("user32.dll", SetLastError=true)] public static extern bool RegisterHotKey(IntPtr h, int id, uint mods, uint vk);
          [DllImport("user32.dll")] public static extern bool UnregisterHotKey(IntPtr h, int id);
          [DllImport("user32.dll")] public static extern void keybd_event(byte key, byte scan, uint flags, UIntPtr extra);
          '@
          $exe = (Resolve-Path artifacts/release/ScreenshotAnnotator-${{ matrix.label }}.exe).Path
          $status = Join-Path $env:RUNNER_TEMP 'wsa-status.txt'
          $env:WSA_STATUS_FILE = $status
          $app = Start-Process $exe -PassThru
          try {
            Start-Sleep -Seconds 5
            $app.Refresh()
            if ($app.HasExited) { throw "App exited on no-args launch (code $($app.ExitCode))" }
            $s = Get-Content $status -Raw; Write-Output $s
            if ($app.MainWindowHandle -ne [IntPtr]::Zero) { throw "No-args launch opened a window: '$($app.MainWindowTitle)'" }
            if ($s -notmatch 'captures_started=0') { throw 'No-args launch started a capture' }
            if ($s -notmatch 'tray_visible=True') { throw 'Tray icon not visible' }
            if ($s -notmatch 'tray_icon_custom=True') { throw 'Tray does not use the app icon' }
            if ($s -notmatch 'hotkey_region_registered=True') { throw 'Ctrl+Alt+A not registered by the app' }
            # Ctrl+Alt (0x0003) | MOD_NOREPEAT (0x4000) + 'A' must already be taken by the running app.
            if ([W.U]::RegisterHotKey([IntPtr]::Zero, 9001, 0x4003, 0x41)) { [W.U]::UnregisterHotKey([IntPtr]::Zero, 9001) | Out-Null; throw 'Ctrl+Alt+A is free: app did not register it' }
            Write-Output "External check: Ctrl+Alt+A is held by the app (error $([Runtime.InteropServices.Marshal]::GetLastWin32Error()))"
            $second = Start-Process $exe -PassThru -Wait
            if ($second.ExitCode -ne 0) { throw "Second launch exit code $($second.ExitCode)" }
            Start-Sleep -Seconds 2
            $app.Refresh()
            if ($app.HasExited) { throw 'First instance died after second launch' }
            $s = Get-Content $status -Raw; Write-Output $s
            if ($s -notmatch 'balloons_shown=1') { throw 'Second launch did not show the already-running tray balloon' }
            if ($s -notmatch 'captures_started=0') { throw 'Second launch started a capture' }
            if ($app.MainWindowHandle -ne [IntPtr]::Zero) { throw 'Second launch opened a window' }
            Write-Output 'Startup behavior check passed'
            # Measure the real hotkey handler -> desktop capture -> visible, painted editor.
            for ($i=0; $i -lt 100 -and (Get-Content $status -Raw) -notmatch 'editor_ready=True'; $i++) { Start-Sleep -Milliseconds 100 }
            if ((Get-Content $status -Raw) -notmatch 'editor_ready=True') { throw 'Tray failed to prewarm its editor' }
            [W.U]::keybd_event(0x11,0,0,[UIntPtr]::Zero); [W.U]::keybd_event(0x12,0,0,[UIntPtr]::Zero); [W.U]::keybd_event(0x46,0,0,[UIntPtr]::Zero)
            [W.U]::keybd_event(0x46,0,2,[UIntPtr]::Zero); [W.U]::keybd_event(0x12,0,2,[UIntPtr]::Zero); [W.U]::keybd_event(0x11,0,2,[UIntPtr]::Zero)
            for ($i=0; $i -lt 100 -and (Get-Content $status -Raw) -notmatch 'editor_open_ms=\d+'; $i++) { Start-Sleep -Milliseconds 100 }
            $s = Get-Content $status -Raw
            $s | Set-Content artifacts/self-test/hotkey-startup.txt
            if ($s -notmatch 'editor_open_ms=(\d+)') { throw 'Hotkey did not open an editor' }
            if ([int]$Matches[1] -ge 1000) { throw "Hotkey to editor took $($Matches[1]) ms (limit <1000 ms)" }
            Write-Output "Real hotkey-to-painted-editor: $($Matches[1]) ms"
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - name: Package EXE and ZIP (EXE + README only)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/zip | Out-Null
          Copy-Item artifacts/release/ScreenshotAnnotator-${{ matrix.label }}.exe,README.md artifacts/zip/
          Compress-Archive -Path artifacts/zip/* -DestinationPath artifacts/release/ScreenshotAnnotator-${{ matrix.label }}.zip
          Get-ChildItem artifacts/release | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenshotAnnotator-${{ matrix.label }}
          path: artifacts/release/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-evidence-${{ matrix.label }}
          path: artifacts/self-test/
  sign:
    # Signs both architectures' EXEs on x64 (azure/artifact-signing-action, formerly trusted-signing-action, does not support ARM runners).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.state.outputs.signed }}
    env:
      HAS_SIGNING: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && secrets.AZURE_SIGNING_ENDPOINT != '' && secrets.AZURE_SIGNING_ACCOUNT != '' && secrets.AZURE_SIGNING_PROFILE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ScreenshotAnnotator-*
          merge-multiple: true
          path: release
      - name: Prepare files to sign
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tosign | Out-Null
          Move-Item release/ScreenshotAnnotator-*.exe tosign/
          Remove-Item release/*.zip
      - name: Warn when signing is not configured
        if: env.HAS_SIGNING != 'true'
        shell: pwsh
        run: |
          Write-Output "::warning title=Unsigned release::Code signing skipped: Azure Artifact Signing secrets (AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE) are not all set. Publishing unsigned EXEs."
      - name: Sign EXEs with Azure Artifact Signing
        if: env.HAS_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\tosign
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify signatures and repackage
        id: state
        shell: pwsh
        run: |
          $signed = $env:HAS_SIGNING -eq 'true'
          foreach ($exe in Get-ChildItem tosign/*.exe) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            Write-Output "$($exe.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($signed -and $sig.Status -ne 'Valid') { throw "$($exe.Name) signature is $($sig.Status)" }
            $label = $exe.BaseName
            New-Item -ItemType Directory -Force "zip/$label" | Out-Null
            Copy-Item $exe.FullName, README.md "zip/$label/"
            Compress-Archive -Path "zip/$label/*" -DestinationPath "release/$label.zip"
            Copy-Item $exe.FullName release/
          }
          "signed=$($signed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Get-ChildItem release | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.sign.outputs.signed }}
        run: |
          cd release
          sha256sum ScreenshotAnnotator-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if [ "$SIGNED" = "true" ]; then
            trust="The EXEs are code-signed (Azure Artifact Signing)."
          else
            trust="The binaries are unsigned: if SmartScreen appears, click More info, then Run anyway."
          fi
          {
            echo "Portable native Windows app: one self-contained EXE per CPU. Nothing to install or extract."
            echo
            echo "- ARM64 (Surface / Snapdragon / Tabo): ScreenshotAnnotator-ARM64.exe"
            echo "- AMD64 (Intel / AMD): ScreenshotAnnotator-AMD64.exe"
            echo
            echo "Double-click the EXE: it starts quietly in the tray (no window). Press Ctrl+Alt+A to capture a region (Ctrl+Alt+F: full desktop). Tray > Settings > Start with Windows enables autostart. $trust The ZIPs contain only the same EXE plus README."
            echo
            echo "SHA-256:"
            echo
            sed 's/^/    /' SHA256SUMS.txt
          } > ../notes.md
          cd ..
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "Screenshot Annotator $GITHUB_REF_NAME" --notes-file notes.md
